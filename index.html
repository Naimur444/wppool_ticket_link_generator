<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPPOOL Ticket Link Generator</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="assets/img/logo.svg" alt="WPPOOL Logo" class="logo">
        </div>

        <div class="card">
            <div class="input-section">
                <h2>Generate Ticket Links</h2>
                <textarea id="inputText" placeholder="Paste your ticket list here...&#10;Example:&#10;[#1153] - Problem with plugin installation. (EchoRewards)&#10;[#958] - Refund request. (FlexTable)"></textarea>
                
                <div class="format-options">
                    <div class="format-option">
                        <input type="radio" id="noFormat" name="format" value="none" checked>
                        <label for="noFormat">Plain Text</label>
                    </div>
                    
                    <div class="format-option">
                        <input type="radio" id="bulletPoints" name="format" value="bullets">
                        <label for="bulletPoints">Bullet Points</label>
                    </div>
                    
                    <div class="format-option">
                        <input type="radio" id="numbers" name="format" value="numbers">
                        <label for="numbers">Numbers</label>
                    </div>
                </div>

                <button class="primary-button" onclick="processTickets()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v19M5 12l7-7 7 7"/>
                    </svg>
                    Generate Links
                </button>
            </div>

            <div class="output-section">
                <div class="result-header">
                    <h2>Generated Links</h2>
                    <button class="copy-button" onclick="copyResult()" id="copyButton">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copy
                    </button>
                </div>
                <div id="result"></div>
            </div>
        </div>
    </div>

    <script src="assets/script.js"></script>
</body>
</html>
